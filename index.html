<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>Photo Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="card">
      <!-- Logo part -->
      <div class="logo-container">
        <!-- এখানে তোমার লোগো ফাইলের path দাও -->
        <img src="./image/titas-log.png" alt="Logo" class="logo-img" />
      </div>

      <!-- Image container -->
      <div class="img-container">
        <div class="img-preview">
          <img id="previewImage" alt="Uploaded preview" />
          <span id="placeholderText" class="placeholder">
            ক্লিক করে ছবি আপলোড করুন / বাছাই করুন
          </span>
          <input type="file" id="imageInput" accept="image/*" title="Upload image"/>
        </div>
      </div>

      <!-- Text container -->
      <div class="text-container">
        <h1>এখানে আমি আমার টাইটেলটাকে রাখছি এবং এটা দেখতে সুন্দর দেখাচ্ছে। সামনে আর কি কোনো মডিফায়ের দরকার আছে ? </h1>
      </div>

      <!-- Time container -->
      <div class="time-container">
        <span> প্রকাশ : </span>
        <span id="timerText"> Timer</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
