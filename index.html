<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Card — উদাহরণ</title>

  <!-- font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page tiro-bangla-regular" role="main">
    <section class="card" id="cardToExport" aria-label="News card preview">
      <!-- Logo part -->
      <div class="logo-container" aria-hidden="true">
        <!-- Use a square container; the image will fit inside -->
        <img src="./image/titas-log.png" alt="Company logo" class="logo-img" />
      </div>

      <!-- Image container -->
      <div class="img-container" aria-label="Image preview area">
        <div class="img-preview" id="imgPreviewBox" tabindex="0">
          <img id="previewImage" alt="Uploaded preview" />
          <span id="placeholderText" class="placeholder">
            ক্লিক করে ছবি আপলোড করুন / বাছাই করুন
          </span>
          <input type="file" id="imageInput" accept="image/*" title="Upload image" aria-label="Upload image" />
        </div>
      </div>

      <!-- Text container -->
      <div class="text-container">
        <h1 class="title" id="cardTitle">
          এখানে আমি আমার টাইটেলটাকে রাখছি এবং এটা দেখতে সুন্দর দেখাচ্ছে। সামনে আর কি কোনো মডিফায়ারের দরকার আছে ? থাকলে আমাকে বলুন। ঠিক করে দিচ্ছি
        </h1>
      </div>

      <!-- Time container -->
      <div class="time-container" aria-live="polite">
        <span>প্রকাশ :</span>
        <span id="timerText">—</span>
      </div>
    </section>
  </main>

  <!-- navigation buttons and controls  -->
  <aside class="navigation" id="controls" role="dialog" aria-label="Editor controls">
    <div class="controls-header">
      <strong>Card Editor</strong>
      <button id="closeControls" title="Close controls" aria-label="Close controls">✕</button>
    </div>

    <label for="titleInput" class="sr-only">Title text</label>
    <input type="text" id="titleInput" placeholder="Enter title text (বাংলা)" />

    <div class="controls-row">
      <button class="increase-font" title="Increase font size">Increase</button>
      <button class="decrease-font" title="Decrease font size">Decrease</button>
      <input type="color" id="titleColor" title="Title color" aria-label="Choose title color" />
    </div>

    <button class="download" id="downloadBtn">Download the Image</button>
    <div class="controls-footnote">Tip: Drag this box to move. Close to see card clearly.</div>
  </aside>

  <noscript>
    <div style="position:fixed;bottom:8px;left:8px;background:#fee;border-radius:6px;padding:8px;">
      জাভাস্ক্রিপ্ট বন্ধ থাকলে পুরো ফাংশনালিটি পাওয়া যাবে না।
    </div>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
